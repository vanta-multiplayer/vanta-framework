worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 64k;
    server_tokens off;

    # Restore visitor IP when traffic arrives via Cloudflare proxy.
    # File is refreshed every CLOUDFLARE_IP_REFRESH_SECONDS (default 3h).
    include /etc/nginx/dynamic/cloudflare-realip.conf;

    # Honor Cloudflare / edge forwarded scheme when present.
    map $http_x_forwarded_proto $auth_forwarded_proto {
        ""      $scheme;
        default $http_x_forwarded_proto;
    }

    log_format auth_log '$remote_addr - $request $status '
                        'rt=$request_time '
                        'cf="$http_cf_connecting_ip" '
                        'fwd="$http_x_forwarded_for" '
                        'proto="$auth_forwarded_proto"';
    access_log /var/log/nginx/access.log auth_log;

    limit_req_zone $binary_remote_addr zone=auth_api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_userinfo:10m rate=60r/s;

    # Docker embedded DNS — ipv6=off avoids AAAA→unreachable on IPv4-only apps.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    # Shared proxy headers (real IP is already rewritten by real_ip module).
    # CF-Connecting-IP is forwarded so the Bun app can rate-limit correctly too.

    # HTTP — ACME http-01 + redirect to HTTPS.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name id.vantamp.xyz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name id.vantamp.xyz;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Variable proxy_pass re-resolves `auth` at request time (survives restarts).
        set $auth_upstream http://auth:28080;

        location = /health {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $auth_forwarded_proto;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-Ray $http_cf_ray;
            proxy_set_header CF-Visitor $http_cf_visitor;
            proxy_pass $auth_upstream;
        }

        location = /eos/userinfo {
            limit_req zone=auth_userinfo burst=120 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $auth_forwarded_proto;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header Authorization $http_authorization;
            proxy_pass $auth_upstream;
        }

        location / {
            limit_req zone=auth_api burst=60 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $auth_forwarded_proto;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header Authorization $http_authorization;
            proxy_pass $auth_upstream;
        }
    }
}
